<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>像素飘流 · Pixel Glider</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="src/style.css?v=tutorial1" />
</head>
<body>
<div id="game-root"></div>
<button id="tutorial-button" class="tutorial-button" type="button" aria-haspopup="dialog" hidden>新手教程</button>
<dialog id="tutorial-dialog" aria-labelledby="tutorial-title">
  <section class="tutorial-panel">
    <p class="tutorial-eyebrow">第一次飞行</p>
    <h2 id="tutorial-title">三步学会像素飘流</h2>
    <img src="assets/tutorial.svg" alt="点击或触摸上升，松开下落，按空格冲刺。冲刺能撞碎绿色藤蔓和敌人，但石墙与浮岛不可撞碎。">
    <button id="tutorial-close" type="button">明白了，返回主界面</button>
  </section>
</dialog>
<section id="menu-audio" aria-label="音量调整" hidden>
  <label for="music-volume">背景音乐 <output id="music-level" for="music-volume">100%</output></label>
  <input id="music-volume" type="range" min="0" max="100" step="1" value="100">
  <label for="effects-volume">游戏音效 <output id="effects-level" for="effects-volume">100%</output></label>
  <input id="effects-volume" type="range" min="0" max="100" step="1" value="100">
</section>
<button id="settings-button" class="settings-button" type="button" aria-haspopup="dialog" hidden>⚙ 设置</button>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <section class="settings-panel">
    <p class="settings-eyebrow">PIXEL GLIDER</p>
    <h2 id="settings-title">游戏设置</h2>
    <p class="settings-subtitle">让风声之外，多一点旋律。</p>
    <label class="audio-option" for="music-enabled">
      <span><strong>背景音乐</strong><small>随群系变换音色的《鹦鹉穿风》</small></span>
      <input id="music-enabled" type="checkbox" role="switch" checked>
    </label>
    <label class="audio-option" for="effects-enabled">
      <span><strong>游戏音效</strong><small>点击、受伤、失败、收集与击毁</small></span>
      <input id="effects-enabled" type="checkbox" role="switch" checked>
    </label>
    <p class="settings-note">偏好会自动保存到本机。</p>
    <button id="settings-close" type="button">完成 · 返回游戏</button>
  </section>
</dialog>

<!--
  普通 <script>（非 ES Module）。Phaser 与运行时素材已经本地打包，
  可以直接双击 index.html，也可以用本地 HTTP 服务调试。

  各文件的顶层 const / class 处于同一个全局词法作用域，天然互相可见，
  所以这里必须按依赖顺序加载 —— 下文每个文件都注明它依赖谁。

  ⚠ 新增模块时请插到正确位置：被依赖者必须排在依赖者前面，
    且 src/main.js 必须始终是最后一个（它在加载时就会 new Phaser.Game()）。
-->

<!-- Bundled engine and data URLs allow offline file:// startup. -->
<script src="vendor/phaser.min.js"></script>
<script src="assets/offline.js"></script>

<!-- [A] 全局常量 & TUNING —— 无依赖 -->
<script src="src/config/constants.js"></script>
<!-- [B] 角色数据 —— 无依赖 -->
<script src="src/config/characters.js"></script>
<!-- [C] 生物群系 —— 依赖 constants（构造 BIOMES 时读 TUNING） -->
<script src="src/config/biomes.js"></script>

<!-- [D] 工具函数 —— 无依赖 -->
<script src="src/utils/helpers.js?v=audio1"></script>
<script src="src/gfx/RenderQuality.js"></script>
<!-- [E] 占位素材工厂 —— 依赖 helpers、characters -->
<script src="src/gfx/TextureFactory.js?v=audio1"></script>
<script src="src/gfx/ArtAssets.js?v=flight1"></script>

<!-- [F] 实体系统 —— 必须按 基类 → 子类 的顺序 -->
<script src="src/entities/Entity.js"></script>
<script src="src/entities/WallEntity.js?v=art2"></script>
<script src="src/entities/FloaterEntity.js"></script>
<script src="src/entities/VineEntity.js"></script>
<script src="src/entities/EnemyEntity.js"></script>
<script src="src/entities/ProjectileEntity.js"></script>
<script src="src/entities/BeeEntity.js?v=art2"></script>
<script src="src/entities/BatEntity.js"></script>
<script src="src/entities/PhantomEntity.js?v=art3"></script>
<script src="src/entities/GlowEntity.js?v=art2"></script>
<script src="src/entities/FireballEntity.js"></script>
<script src="src/entities/GhastEntity.js"></script>
<script src="src/entities/NewEnemyEntities.js"></script>
<script src="src/entities/EmeraldEntity.js"></script>
<script src="src/entities/LifeCrystalEntity.js"></script>

<!-- [G][H] 系统层 —— 依赖 constants 与各实体类 -->
<script src="src/systems/BackgroundManager.js?v=art2"></script>
<script src="src/systems/SpawnManager.js?v=art2"></script>

<!-- [I][J][K] 场景 —— 依赖 constants / characters / biomes / 系统层 -->
<script src="src/systems/AudioController.js?v=audio1"></script>
<script src="src/ui/SettingsUI.js?v=audio2"></script>
<script src="src/ui/TutorialUI.js?v=tutorial1"></script>
<script src="src/scenes/BootScene.js?v=flight1"></script>
<script src="src/scenes/MenuScene.js?v=tutorial1"></script>
<script src="src/scenes/CharacterSelectScene.js?v=flight1"></script>
<script src="src/scenes/GameScene.js?v=flight1"></script>
<script src="src/scenes/GameOverScene.js"></script>

<!-- [L] 入口 —— 必须最后加载 -->
<script src="src/main.js"></script>
</body>
</html>
